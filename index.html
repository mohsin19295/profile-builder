<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css?v=4">
    <title>Profile Builder</title>
</head>

<body>
    <header class="app-header">
        <div>
            <h1>Profile Builder</h1>
            <p>Fill in your details and the resume updates live. Everything is saved in this browser.</p>
        </div>
        <div class="toolbar">
            <button type="button" class="btn" data-cmd="sample">Reset to default</button>
            <button type="button" class="btn primary" data-cmd="export-word">Download Word</button>
            <button type="button" class="btn primary" data-cmd="export-pdf"
                title="Opens the print dialog. Choose 'Save as PDF' as the destination.">Download PDF</button>
        </div>
    </header>

    <main class="app">
        <form id="editor" class="editor" autocomplete="on" novalidate></form>

        <section class="preview-pane" aria-label="Resume preview">
            <div class="design-bar">
                <label>Template
                    <select data-bind="settings.template">
                        <option value="classic">Classic</option>
                        <option value="modern">Modern (sidebar)</option>
                    </select>
                </label>
                <label>Font
                    <select data-bind="settings.font">
                        <option value="sans">Sans-serif</option>
                        <option value="serif">Serif</option>
                    </select>
                </label>
                <label>Accent
                    <input type="color" data-bind="settings.accent">
                </label>
                <span class="design-hint">PDF: choose "Save as PDF" in the print dialog.</span>
            </div>
            <div class="preview-scroll">
                <article id="resume" class="resume"></article>
            </div>
        </section>
    </main>

    <div id="toast" role="status" aria-live="polite"></div>

    <script src="./script.js?v=8"></script>
</body>

</html>
